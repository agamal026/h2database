name: H2 4454 engine negative controls
on:
  push:
    branches: [review/4454-engine-20261018]
permissions:
  contents: read
jobs:
  engine:
    name: Engine ${{ matrix.mode }} / Java 17
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: baseline
            source: f2922a7766ec2472bc65d5e5ab4086390a76a42c
          - mode: candidate
            source: 40b3bda1bac76ab59e9b0e4d54ac1935a398685b
    steps:
      - uses: actions/checkout@v6
        with:
          path: evidence
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.source }}
          path: source
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - name: Verify exact source and build real H2
        working-directory: source/h2
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git status --porcelain
          git ls-files -s src/main/org/h2/index/IndexCondition.java src/test/org/h2/test/db/TestCompoundIndexSearch.java
          java -version
          export JAVA_OPTS=-Xmx512m
          ./build.sh jar
          sha256sum bin/h2-*.jar
      - name: Run JDBC regression and index-plan controls
        working-directory: source/h2
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          mkdir -p proof-classes
          javac --release 11 -cp 'bin/*' -d proof-classes ../../evidence/contribution-review/4454/Run4454.java
          java -ea -cp 'bin/*:proof-classes' Run4454 "$MODE"
